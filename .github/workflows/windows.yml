name: Windows build and validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - run: npx --no-install playwright install chromium
      - run: npm test
      - run: npm run test:desktop -- --reporter=list,github
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Extract and validate portable Windows app
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/*Portable.zip | Select-Object -First 1
          if (-not $archive) { throw 'Portable ZIP missing' }
          $portableDir = Join-Path $env:RUNNER_TEMP 'baccarat-portable'
          $protocolPath = 'Registry::HKEY_CURRENT_USER\Software\Classes\baccarat-analyzer'
          $protocolBefore = Test-Path $protocolPath
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $portableDir
          $env:DESKTOP_TEST_EXECUTABLE = Join-Path $portableDir 'Baccarat Live Analyzer.exe'
          $env:DESKTOP_TEST_OCR_RESOURCES = Join-Path $portableDir 'resources/ocr'
          if (-not (Test-Path $env:DESKTOP_TEST_EXECUTABLE)) { throw 'Portable executable missing' }
          if (-not (Test-Path (Join-Path $portableDir '사용방법.txt'))) { throw 'Portable usage guide missing' }
          if (Get-ChildItem $portableDir -Recurse -Filter '*Setup.exe') { throw 'Installer included in portable ZIP' }
          npx --no-install playwright test --reporter=list,github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Test-Path $protocolPath) -ne $protocolBefore) { throw 'Portable app changed protocol registration' }
      - uses: actions/upload-artifact@v4
        with:
          name: baccarat-windows-x64-portable
          path: ${{ runner.temp }}/baccarat-portable/**
          if-no-files-found: error

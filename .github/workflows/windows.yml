name: Windows build and validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - run: npx --no-install playwright install chromium
      - run: npm test
      - run: npm run test:desktop -- --reporter=list,github
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and validate packaged Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*Setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'baccarat-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:DESKTOP_TEST_EXECUTABLE = Join-Path $installDir 'Baccarat Live Analyzer.exe'
          $env:DESKTOP_TEST_OCR_RESOURCES = Join-Path $installDir 'resources/ocr'
          if (-not (Test-Path $env:DESKTOP_TEST_EXECUTABLE)) { throw 'Installed executable missing' }
          try {
            $protocol = (Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\baccarat-analyzer\shell\open\command').'(default)'
            if (-not $protocol.Contains('Baccarat Live Analyzer.exe')) { throw 'Chrome launch protocol not registered' }
          } catch {
            Write-Output "::error::Chrome launch registration failed: $($_.Exception.Message)"
            throw
          }
          npx --no-install playwright test --reporter=list,github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: baccarat-windows-x64-installer
          path: release/*Setup.exe
          if-no-files-found: error
